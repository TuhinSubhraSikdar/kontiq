<svg class="icon{% if class %} {{ class }}{% endif %}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    {% if name == "dashboard" %}
        <rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect>
    {% elif name == "projects" or name == "folder" %}
        <path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h5l2 2h8A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"></path>
    {% elif name == "tasks" %}
        <path d="M9 6h11M9 12h11M9 18h11"></path><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"></path>
    {% elif name == "prompts" %}
        <path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-1-1.7V6a2 2 0 0 1 2-2Z"></path><path d="M8 9h8M8 13h5"></path>

        <path d="m12 3 1.2 3.3L16.5 7.5l-3.3 1.2L12 12l-1.2-3.3-3.3-1.2 3.3-1.2zM18 13l.8 2.2L21 16l-2.2.8L18 19l-.8-2.2L15 16l2.2-.8zM6 14l.8 2.2L9 17l-2.2.8L6 20l-.8-2.2L3 17l2.2-.8z"></path>

        <rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 10h18"></path><path d="M12 14v3l2 1"></path>
    {% elif name == "library" %}
        <path d="M6 3h9l4 4v14H6z"></path><path d="M15 3v5h5M9 13h7M9 17h7"></path><path d="M3 7v13a1 1 0 0 0 1 1h2"></path>

        <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
    {% elif name == "settings" %}
        <path d="M4 7h10M18 7h2M4 17h2M10 17h10M8 5v4M8 15v4M16 5v4M16 15v4"></path>
    {% elif name == "database" %}
        <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"></path>
    {% elif name == "queue" %}
        <path d="M4 7h13l-3-3M20 17H7l3 3"></path><path d="m17 7 3-3M7 17l-3 3"></path>
    {% elif name == "menu" %}
        <path d="M4 6h16M4 12h16M4 18h16"></path>
    {% elif name == "logout" %}
        <path d="M10 5H5v14h5M14 8l4 4-4 4M18 12H9"></path>
    {% elif name == "check" %}
        <path d="m5 12 4 4L19 6"></path>
    {% elif name == "lock" %}
        <rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
    {% else %}
        <circle cx="12" cy="12" r="8"></circle>
    {% endif %}
</svg>
