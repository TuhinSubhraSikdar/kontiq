{% include "components/form_errors.html" %}
{% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
{% for field in form.visible_fields %}
    <div class="field-group{% if field.errors %} field-invalid{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>
        {{ field }}
        {% if field.help_text %}<p class="field-help">{{ field.help_text }}</p>{% endif %}
        {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
